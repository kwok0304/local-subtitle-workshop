name: Build Local Subtitle Workshop APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build files
        uses: actions/checkout@v4

      - name: Check out upstream source
        run: |
          git clone https://github.com/Serkali-sudo/auto-subtitle-generator.git source
          cd source
          git checkout a5ae6abe8b13a7d3afc1a5f3c9b9e497be3004d6

      - name: Add standalone Douyin downloader app
        run: git -C source apply ../patches/douyin-downloader-app.patch

      - name: Prefer China-hosted Whisper models
        run: git -C source apply ../patches/subtitle-cn-model-source.patch

      - name: Recommend fast Chinese mobile models
        run: git -C source apply ../patches/subtitle-cn-model-guidance.patch

      - name: Fix subtitle sharing and add Markdown export
        run: git -C source apply ../patches/subtitle-export-sharing-md.patch

      - name: Apply Chinese UI identity
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "app/build.gradle": [
                  ('applicationId "com.serhat.autosub"', 'applicationId "com.niugulu.localsub"'),
                  ('versionCode 6', 'versionCode 11'),
                  ('versionName "1.5"', 'versionName "1.9-zh-share-md"'),
              ],
              "app/src/main/res/values/strings.xml": [
                  ('>AutoSub<', '>本地字幕工坊<'),
              ],
              "app/src/main/res/menu/bottom_navigation_menu.xml": [
                  ('title="Generate"', 'title="生成"'),
                  ('title="Models"', 'title="模型"'),
                  ('title="Exports"', 'title="导出"'),
                  ('title="Settings"', 'title="设置"'),
              ],
              "app/src/main/res/menu/main_menu.xml": [
                  ('title="Add Videos"', 'title="添加视频"'),
                  ('title="Models"', 'title="模型"'),
                  ('title="See on GitHub"', 'title="在 GitHub 查看"'),
              ],
              "app/src/main/res/layout/fragment_models.xml": [
                  ('hint="Search models"', 'hint="搜索模型"'),
                  ('text="All"', 'text="全部"'),
                  ('text="Installed"', 'text="已安装"'),
                  ('text="Mobile"', 'text="移动端"'),
                  ('text="Downloading"', 'text="下载中"'),
                  ('text="Loading selected speech model into memory…"', 'text="正在将语音模型加载到内存，请稍候…"'),
              ],
              "app/src/main/res/layout/fragment_generate.xml": [
                  ('text="Speech model"', 'text="语音识别模型"'),
                  ('text="Bundled model"', 'text="内置模型"'),
                  ('text="Models"', 'text="模型"'),
                  ('text="Add"', 'text="添加"'),
                  ('text="Stop"', 'text="停止"'),
                  ('text="Export"', 'text="导出"'),
                  ('text="Pending"', 'text="等待中"'),
                  ('text="Processing"', 'text="处理中"'),
                  ('text="Completed"', 'text="已完成"'),
                  ('text="Failed"', 'text="失败"'),
              ],
              "app/src/main/res/layout/fragment_settings.xml": [
                  ('text="Batch subtitles"', 'text="批量字幕"'),
                  ('text="Maximum words per subtitle"', 'text="每条字幕最大词数"'),
                  ('text="10 words"', 'text="10 个词"'),
                  ('text="Keep sentences together"', 'text="尽量保持句子完整"'),
                  ('text="Remove Whisper SDH captions"', 'text="移除 Whisper 的音效说明字幕"'),
                  ('text="Use VAD to skip silence for Whisper"', 'text="Whisper 使用 VAD 跳过静音"'),
                  ('text="Whisper VAD model"', 'text="Whisper VAD 模型"'),
                  ('text="Whisper VAD aggressiveness"', 'text="Whisper VAD 灵敏度"'),
                  ('text="Whisper language"', 'text="Whisper 语言"'),
                  ('text="Whisper thread count"', 'text="Whisper 线程数"'),
                  ('text="Translate subtitles"', 'text="翻译字幕"'),
                  ('text="Translation source"', 'text="翻译源语言"'),
                  ('text="Translation target"', 'text="翻译目标语言"'),
                  ('text="Export location"', 'text="导出位置"'),
                  ('text="Private"', 'text="私有目录"'),
                  ('text="Movies"', 'text="电影目录"'),
                  ('text="Shorts preview"', 'text="短片预览"'),
                  ('text="Caption size"', 'text="字幕大小"'),
                  ('text="Uppercase highlighted words"', 'text="高亮词转为大写"'),
                  ('text="Use word-by-word captions for vertical videos"', 'text="竖版视频逐词显示字幕"'),
                  ('text="Don’t ask about Shorts mode again"', 'text="不再询问短片模式"'),
                  ('text="Use smooth pan for auto-framing"', 'text="自动构图使用平滑平移"'),
                  ('text="Notifications"', 'text="通知"'),
                  ('text="Show completion notifications"', 'text="任务完成时发送通知"'),
                  ('text="Show RAM usage on Generate"', 'text="在生成页显示内存占用"'),
              ],
              "app/src/main/res/layout/fragment_exports.xml": [
                  ('hint="Search exports"', 'hint="搜索导出内容"'),
                  ('text="Videos"', 'text="视频"'),
                  ('text="Subtitles"', 'text="字幕"'),
                  ('text="Folders"', 'text="文件夹"'),
                  ('text="No exports yet"', 'text="暂时没有导出文件"'),
              ],
              "app/src/main/res/layout/item_queue.xml": [
                  ('text="Cancel"', 'text="取消"'),
                  ('text="Export video"', 'text="导出视频"'),
                  ('text="Export subs"', 'text="导出字幕"'),
                  ('text="Create Shorts"', 'text="生成短片"'),
                  ('text="Share"', 'text="分享"'),
                  ('text="Play"', 'text="播放"'),
                  ('text="Retry"', 'text="重试"'),
                  ('text="Del"', 'text="删除"'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          java_pairs = [
              ('title = "Models";', 'title = "模型";'),
              ('title = "Exports";', 'title = "导出";'),
              ('title = "Settings";', 'title = "设置";'),
              ('binding.toolbar.setTitle("Preview");', 'binding.toolbar.setTitle("预览");'),
              ('"Long video detected"', '"检测到长视频"'),
              ('"This video is longer than " + VAD_PROMPT_THRESHOLD_MINUTES + " minutes. AutoSub can skip silent"\n                        + " stretches to finish faster, but skipping audio can occasionally drop quiet speech or"\n                        + " shift some subtitle timings."', '"该视频超过 " + VAD_PROMPT_THRESHOLD_MINUTES + " 分钟。跳过静音可加快处理，"\n                        + "但偶尔可能漏掉轻声说话，或使部分字幕时间偏移。"'),
              ('"Skip silence (faster)"', '"跳过静音（更快）"'),
              ('"Speeds up processing by skipping silent parts. May miss some dialog or shift timings."', '"跳过静音片段以加快处理，可能漏掉少量对白或使时间轴偏移。"'),
              ('"Full accuracy"', '"完整识别"'),
              ('"Processes the entire audio. Slower, but the most reliable timings and dialog."', '"处理完整音频。更慢，但对白与时间轴最可靠。"'),
              ('"Shorts video detected"', '"检测到竖版短视频"'),
              ('"Vertical videos can be captioned one word at a time for a Shorts-style preview."', '"竖版视频可逐词显示字幕，适合短视频预览。 "'),
              ('"Word-by-word captions"', '"逐词字幕"'),
              ('"Show one recognized word at a time. Best for short-form social clips."', '"每次显示一个识别出的词，适合短视频内容。 "'),
              ('"Standard captions"', '"标准字幕"'),
              ('"Create normal subtitle lines. Better for readability and longer speech."', '"生成常规字幕行，更适合阅读和较长的语音内容。 "'),
              ('"Don\'t show this again"', '"不再提示"'),
              ('"Search models"', '"搜索模型"'),
              ('"Selected"', '"已选择"'),
              ('"Installed"', '"已安装"'),
              ('"Cloud"', '"云端下载"'),
              ('"Mobile"', '"移动端"'),
              ('"Heavy"', '"大型"'),
              ('"Downloading"', '"下载中"'),
              ('"Queued"', '"队列中"'),
              ('"Paused"', '"已暂停"'),
              ('"Get"', '"下载"'),
              ('"Use"', '"使用"'),
              ('"Delete"', '"删除"'),
              ('"Cancel"', '"取消"'),
              ('"Auto detect"', '"自动检测"'),
              ('"Very aggressive"', '"高灵敏度"'),
              ('"Aggressive"', '"较高灵敏度"'),
              ('"Moderate"', '"中等灵敏度"'),
              ('"Conservative"', '"低灵敏度"'),
              ('"Automatic"', '"自动"'),
              ('"Default"', '"默认"'),
              ('"Download model"', '"下载模型"'),
              ('"Use model"', '"使用模型"'),
              ('"Delete model"', '"删除模型"'),
              ('"Cancel download"', '"取消下载"'),
              ('"Resume download"', '"继续下载"'),
              ('"Pause download"', '"暂停下载"'),
          ]
          for path in Path("app/src/main").rglob("*"):
              if path.suffix not in {".java", ".kt"}:
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in java_pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Snapdragon APK
        uses: actions/upload-artifact@v4
        with:
          name: local-subtitle-workshop-zh-arm64-v8a
          path: source/app/build/outputs/apk/**/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload standalone Douyin downloader
        uses: actions/upload-artifact@v4
        with:
          name: douyin-downloader-helper-arm64-v8a
          path: source/downloader/build/outputs/apk/**/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7
